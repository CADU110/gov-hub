# GERADO por `make modelo` a partir de catalogo/sistemas/compras_gov.yml — não edite à mão.
#
# Fontes relacionais descritas por origem_atual no catálogo.
# Tabelas raw mantêm o source do sistema; a Bronze materializada
# usa o source <sistema>_bronze, sem alterar a ingestão.

version: 2

sources:
  - name: compras_gov
    schema: compras_gov
    description: >
      Camada Bronze de Compras.gov.br (SIASG): dado fiel à fonte, gravado pelas
      DAGs de ingestão. Sistema estruturante de compras e contratações do governo
      federal. Expõe API pública de consulta a órgãos, UASGs, fornecedores,
      contratos, contratações e catálogos de material e serviço.
    meta:
      owner: "@GovHub-br/oss"
      sistema_origem: compras_gov
      camada: bronze
    tables:
      - name: arp_adesoes_item
        identifier: raw_arp_adesoes_item
        description: >
            Adesões vinculadas aos itens das Atas de Registro de Preço. Granularidade:
            uma linha por adesão vinculada a um item de ata.
        meta:
          classificacao: publico
          dag_ingestao: arp_detalhes_ingest_dag

      - name: arp_empenhos_saldo
        identifier: raw_arp_empenhos_saldo
        description: >
            Empenhos e saldos vinculados às Atas de Registro de Preço. Granularidade:
            uma linha por empenho e saldo de uma ata.
        meta:
          classificacao: publico
          dag_ingestao: arp_detalhes_ingest_dag

      - name: arp_item
        identifier: raw_arp_item
        description: >
            Itens associados às Atas de Registro de Preço do Compras.gov.br.
            Granularidade: uma linha por item, fornecedor, ata, unidade gerenciadora e
            compra.
        meta:
          classificacao: publico
          dag_ingestao: arp_item_ingest_dag

      - name: arp_unidades_item
        identifier: raw_arp_unidades_item
        description: >
            Unidades vinculadas aos itens das Atas de Registro de Preço. Granularidade:
            uma linha por unidade vinculada a um item de ata.
        meta:
          classificacao: publico
          dag_ingestao: arp_detalhes_ingest_dag

      - name: caracteristicas_material
        identifier: raw_caracteristicas_material
        description: >
            Características dos itens e seus valores. Granularidade: uma linha por item,
            característica e valor de característica.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_material_caracteristicas_ingest_dag

      - name: classe_material
        identifier: raw_classe_material
        description: >
            Classes da hierarquia do catálogo de materiais. Granularidade: uma linha por
            classe.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_material_grupo_classe_ingest_dag

      - name: classe_servico
        identifier: raw_classe_servico
        description: >
            Classes da hierarquia do catálogo de serviços. Granularidade: uma linha por
            classe.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_servico_hierarquia_ingest_dag

      - name: contratacoes
        identifier: raw_contratacoes
        description: >
            Contratações publicadas sob a Lei 14.133, via integração com o PNCP.
            Granularidade: uma linha por compra.
        meta:
          classificacao: publico
          dag_ingestao: contratacoes_ingest_dag

      - name: contratos
        identifier: raw_contratos
        description: >
            Contratos administrativos por órgão. Uma linha por contrato de uma unidade
            gestora com um fornecedor. Granularidade: uma linha por unidade gestora,
            número de contrato e fornecedor.
        meta:
          classificacao: publico
          dag_ingestao: contratos_ingest_dag

      - name: contratos_item
        identifier: raw_contratos_item
        description: >
            Itens dos contratos administrativos. Granularidade: uma linha por item de um
            contrato.
        meta:
          classificacao: publico
          dag_ingestao: contratos_item_ingest_dag

      - name: divisao_servico
        identifier: raw_divisao_servico
        description: >
            Divisões da hierarquia do catálogo de serviços. Granularidade: uma linha por
            divisão.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_servico_hierarquia_ingest_dag

      - name: fornecedor
        identifier: raw_fornecedor
        description: >
            Fornecedores ativos no Compras.gov.br. O cadastro já identifica cada
            fornecedor pelo documento, em duas colunas distintas — CNPJ para pessoa
            jurídica, CPF para pessoa física. Não existe aqui uma coluna única de número
            de inscrição (nu_ni): esta entidade expõe as chaves finais diretamente, sem
            precisar das pontes de nu_ni. Granularidade: um registro por fornecedor
            ativo, identificado por CNPJ ou CPF.
        meta:
          classificacao: pessoal
          dag_ingestao: fornecedor_ingest_dag

      - name: grupo_material
        identifier: raw_grupo_material
        description: >
            Grupos da hierarquia do catálogo de materiais. Granularidade: uma linha por
            grupo.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_material_grupo_classe_ingest_dag

      - name: grupo_servico
        identifier: raw_grupo_servico
        description: >
            Grupos da hierarquia do catálogo de serviços. Granularidade: uma linha por
            grupo.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_servico_hierarquia_ingest_dag

      - name: item_material
        identifier: raw_item_material
        description: >
            Itens da hierarquia do catálogo de materiais. Granularidade: uma linha por
            item.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_material_item_ingest_dag

      - name: item_servico
        identifier: raw_item_servico
        description: >
            Itens da hierarquia do catálogo de serviços, ativos e inativos. Em object
            storage, um item inativado mantém a linha ativa antiga: o status atual é o
            do registro mais recente por dt_ingest. Granularidade: uma linha por item.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_servico_item_ingest_dag

      - name: itens_contratacoes
        identifier: raw_itens_contratacoes
        description: >
            Itens das contratações publicadas sob a Lei 14.133. Granularidade: uma linha
            por item de compra.
        meta:
          classificacao: publico
          dag_ingestao: itens_contratacoes_ingest_dag

      - name: natureza_despesa_material
        identifier: raw_natureza_despesa_material
        description: >
            Associação entre os PDMs (padrões descritivos de material) do catálogo e as
            naturezas de despesa sob as quais o material é empenhado. Não é um cadastro
            de naturezas de despesa: a mesma natureza aparece em vários PDMs, e a origem
            repete pares sem deduplicar. Granularidade: uma linha por associação entre
            PDM e natureza de despesa.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_material_natureza_despesa_ingest_dag

      - name: natureza_despesa_servico
        identifier: raw_natureza_despesa_servico
        description: >
            Associação entre os serviços do catálogo e as naturezas de despesa sob as
            quais o serviço é empenhado. Não é um cadastro de naturezas de despesa: a
            mesma natureza aparece em vários serviços, e a origem repete pares sem
            deduplicar. Granularidade: uma linha por associação entre serviço e natureza
            de despesa.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_servico_natureza_despesa_ingest_dag

      - name: orgao
        identifier: raw_orgao
        description: >
            Órgãos cadastrados no Compras.gov.br. Uma linha por órgão. Granularidade: um
            registro por código de órgão.
        meta:
          classificacao: publico
          dag_ingestao: orgao_ingest_dag

      - name: pdm_material
        identifier: raw_pdm_material
        description: >
            Padrões descritivos de material (PDM) da hierarquia do catálogo de
            materiais. Granularidade: uma linha por PDM.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_material_pdm_ingest_dag

      - name: pesquisa_preco_material
        identifier: raw_pesquisa_preco_material
        description: >
            Registros de preços consultados para itens do catálogo de materiais
            Granularidade: uma linha por registro de preço de material.
        meta:
          classificacao: pessoal
          dag_ingestao: pesquisa_preco_material_ingest_dag

      - name: pesquisa_preco_servico
        identifier: raw_pesquisa_preco_servico
        description: >
            Registros de preços consultados para itens do catálogo de serviços
            Granularidade: uma linha por registro de preço de serviço.
        meta:
          classificacao: pessoal
          dag_ingestao: pesquisa_preco_servico_ingest_dag

      - name: pgc_agregacao
        identifier: raw_pgc_agregacao
        description: >
            Dados agregados do Plano de Contratações Anual por órgão e ano, incluindo
            quantidade total de itens e valor total estimado. Granularidade: uma linha
            por órgão e ano do Plano de Contratações Anual.
        meta:
          classificacao: publico
          dag_ingestao: pgc_agregacao_ingest_dag

      - name: pgc_detalhe
        identifier: raw_pgc_detalhe
        description: >
            Itens planejados no Plano de Contratações Anual, com informações do
            artefato, DFD, item de catálogo, quantidade e valor estimado. Granularidade:
            uma linha por item planejado de um Plano de Contratações Anual.
        meta:
          classificacao: publico
          dag_ingestao: pgc_detalhe_ingest_dag

      - name: pgc_detalhe_catalogo
        identifier: raw_pgc_detalhe_catalogo
        description: >
            Itens planejados no Plano de Contratações Anual consultados a partir de
            códigos de material e serviço do catálogo Compras.gov.br. Granularidade: uma
            linha por item planejado de um Plano de Contratações Anual, consultado por
            código de catálogo.
        meta:
          classificacao: publico
          dag_ingestao: pgc_detalhe_catalogo_ingest_dag

      - name: resultado_itens_contratacoes
        identifier: raw_resultado_itens_contratacoes
        description: >
            Resultados dos itens das contratações publicadas sob a Lei 14.133, incluindo
            fornecedores, quantidades e valores apresentados. Granularidade: uma linha
            por resultado de item de contratação.
        meta:
          classificacao: publico
          dag_ingestao: resultado_itens_contratacoes_ingest_dag

      - name: secao_servico
        identifier: raw_secao_servico
        description: >
            Seções da hierarquia do catálogo de serviços. Granularidade: uma linha por
            seção.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_servico_hierarquia_ingest_dag

      - name: subclasse_servico
        identifier: raw_subclasse_servico
        description: >
            Subclasses da hierarquia do catálogo de serviços. Granularidade: uma linha
            por subclasse.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_servico_hierarquia_ingest_dag

      - name: uasg
        identifier: raw_uasg
        description: >
            Unidades administrativas de serviços gerais. Uma linha por UASG.
            Granularidade: um registro por código de UASG.
        meta:
          classificacao: publico
          dag_ingestao: uasg_ingest_dag

      - name: und_medida_servico
        identifier: raw_und_medida_servico
        description: >
            Unidades de medida associadas aos serviços. Granularidade: uma linha por
            serviço e unidade de medida.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_servico_und_medida_ingest_dag

      - name: unidade_fornecimento_material
        identifier: raw_unidade_fornecimento_material
        description: >
            Unidades de fornecimento associadas aos PDMs. Granularidade: uma linha por
            PDM e unidade de fornecimento.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_material_unidade_fornecimento_ingest_dag

  - name: compras_gov_bronze
    schema: 001_bnz_compras_gov
    database: "{{ 'data_warehouse' if target.type == 'duckdb' else env_var('DBT_DATABASE', 'data_warehouse') }}"
    description: >
      Camada Bronze de Compras.gov.br (SIASG): dado fiel à fonte, gravado pelo
      dbt. Sistema estruturante de compras e contratações do governo federal.
      Expõe API pública de consulta a órgãos, UASGs, fornecedores, contratos,
      contratações e catálogos de material e serviço.
    meta:
      owner: "@GovHub-br/oss"
      sistema_origem: compras_gov
      camada: bronze
    tables:
      - name: arp
        identifier: arp
        description: >
            Atas de Registro de Preço consultadas no módulo ARP do Compras.gov.br.
            Granularidade: uma linha por ata de registro de preço e compra.
        meta:
          classificacao: publico
          dag_ingestao: arp_ingest_dag
