# Compras.gov.br (SIASG) — catálogo de entidades e chaves de cruzamento.
# Ver catalogo/README.md e ADR-0017.

sistema: compras_gov
nome: Compras.gov.br (SIASG)
descricao: >-
  Sistema estruturante de compras e contratações do governo federal. Expõe API
  pública de consulta a órgãos, UASGs, fornecedores, contratos, contratações e
  catálogos de material e serviço.
orgao_gestor: mgi
owner: "@GovHub-br/oss"
status: ingerido

entidades:

  orgao:
    descricao: >-
      Órgãos cadastrados no Compras.gov.br. Uma linha por órgão.
    granularidade: um registro por código de órgão
    dominio: organizacional
    dag: orgao_ingest_dag
    origem_atual: compras_gov.raw_orgao
    chave_primaria: [codigoorgao]
    classificacao: publico
    chaves:
      - chave: co_orgao
        coluna: codigoorgao
        verificado: true

  uasg:
    descricao: >-
      Unidades administrativas de serviços gerais. Uma linha por UASG.
    granularidade: um registro por código de UASG
    dominio: organizacional
    dag: uasg_ingest_dag
    origem_atual: compras_gov.raw_uasg
    chave_primaria: [codigouasg]
    classificacao: publico
    chaves:
      - chave: co_uasg
        coluna: codigouasg
        verificado: true
      - chave: co_orgao
        coluna: codigoorgao
        verificado: true

  fornecedor:
    descricao: >-
      Fornecedores ativos no Compras.gov.br. O cadastro já identifica cada
      fornecedor pelo documento, em duas colunas distintas — CNPJ para pessoa
      jurídica, CPF para pessoa física. Não existe aqui uma coluna única de
      número de inscrição (nu_ni): esta entidade expõe as chaves finais
      diretamente, sem precisar das pontes de nu_ni.
    granularidade: um registro por fornecedor ativo, identificado por CNPJ ou CPF
    dominio: fornecedores
    dag: fornecedor_ingest_dag
    origem_atual: compras_gov.raw_fornecedor
    chave_primaria: [cnpj, cpf]
    classificacao: pessoal
    chaves:
      - chave: nu_cnpj
        coluna: cnpj
        verificado: true
        opcional: true
        observacao: >-
          Nulo quando o fornecedor é pessoa física; nesse caso o documento está
          em cpf.
      - chave: nu_cpf
        coluna: cpf
        verificado: true
        opcional: true
        observacao: >-
          Preenchido apenas para fornecedor pessoa física — dado pessoal sob a
          LGPD, ainda que a origem seja pública (ADR-0013). Nulo para pessoa
          jurídica.

  contratos:
    descricao: >-
      Contratos administrativos por órgão. Uma linha por contrato de uma
      unidade gestora com um fornecedor.
    granularidade: uma linha por unidade gestora, número de contrato e fornecedor
    dominio: contratacoes
    dag: contratos_ingest_dag
    origem_atual: compras_gov.raw_contratos
    chave_primaria: [codigounidadegestora, numerocontrato, nifornecedor]
    classificacao: publico
    chaves:
      - chave: co_uasg
        coluna: codigounidadegestora
        verificado: true
      - chave: nu_ni
        coluna: nifornecedor
        verificado: true

  contratos_item:
    descricao: >-
      Itens dos contratos administrativos.
    granularidade: uma linha por item de um contrato
    dominio: contratacoes
    dag: contratos_item_ingest_dag
    origem_atual: compras_gov.raw_contratos_item
    chave_primaria:
      [codigounidadegestora, numerocontrato, nifornecedor, numeroitem, contratoitemexcluido]
    classificacao: publico
    chaves:
      - chave: co_uasg
        coluna: codigounidadegestora
        verificado: true
      - chave: nu_ni
        coluna: nifornecedor
        verificado: true

  contratacoes:
    descricao: >-
      Contratações publicadas sob a Lei 14.133, via integração com o PNCP.
    granularidade: uma linha por compra
    dominio: contratacoes
    dag: contratacoes_ingest_dag
    origem_atual: compras_gov.raw_contratacoes
    chave_primaria: [idcompra]
    classificacao: publico
    chaves: []

  itens_contratacoes:
    descricao: >-
      Itens das contratações publicadas sob a Lei 14.133.
    granularidade: uma linha por item de compra
    dominio: contratacoes
    dag: itens_contratacoes_ingest_dag
    origem_atual: compras_gov.raw_itens_contratacoes
    chave_primaria: [idcompraitem]
    classificacao: publico
    chaves: []

  resultado_itens_contratacoes:
    descricao: >-
      Resultados dos itens das contratações publicadas sob a Lei 14.133,
      incluindo fornecedores, quantidades e valores apresentados.
    granularidade: uma linha por resultado de item de contratação
    dominio: contratacoes
    dag: resultado_itens_contratacoes_ingest_dag
    origem_atual: compras_gov.raw_resultado_itens_contratacoes
    chave_primaria: [idcompraitem, sequencialresultado]
    classificacao: publico
    chaves: []

  natureza_despesa_material:
    descricao: >-
      Associação entre os PDMs (padrões descritivos de material) do catálogo e
      as naturezas de despesa sob as quais o material é empenhado. Não é um
      cadastro de naturezas de despesa: a mesma natureza aparece em vários
      PDMs, e a origem repete pares sem deduplicar.
    granularidade: uma linha por associação entre PDM e natureza de despesa
    dominio: catalogo
    dag: catalogo_material_natureza_despesa_ingest_dag
    origem_atual: compras_gov.raw_natureza_despesa_material
    chave_primaria: [codigopdm, codigonaturezadespesa]
    classificacao: publico
    chaves:
      - chave: co_natureza_despesa
        coluna: codigonaturezadespesa
        verificado: true
        observacao: >-
          A origem entrega a natureza detalhada de 8 dígitos, não a forma curta
          de 6 usada em parte dos relatórios do SIAFI.
  
  grupo_material:
    descricao: >-
      Grupos da hierarquia do catálogo de materiais.
    granularidade: uma linha por grupo
    dominio: catalogo
    dag: catalogo_material_grupo_classe_ingest_dag
    origem_atual: compras_gov.raw_grupo_material
    chave_primaria: [codigogrupo]
    classificacao: publico
    chaves: []

  classe_material:
    descricao: >-
      Classes da hierarquia do catálogo de materiais.
    granularidade: uma linha por classe
    dominio: catalogo
    dag: catalogo_material_grupo_classe_ingest_dag
    origem_atual: compras_gov.raw_classe_material
    chave_primaria: [codigoclasse]
    classificacao: publico
    chaves: []

  pdm_material:
    descricao: >-
      Padrões descritivos de material (PDM) da hierarquia do catálogo de
      materiais.
    granularidade: uma linha por PDM
    dominio: catalogo
    dag: catalogo_material_pdm_ingest_dag
    origem_atual: compras_gov.raw_pdm_material
    chave_primaria: [codigopdm]
    classificacao: publico
    chaves: []

  item_material:
    descricao: >-
      Itens da hierarquia do catálogo de materiais.
    granularidade: uma linha por item
    dominio: catalogo
    dag: catalogo_material_item_ingest_dag
    origem_atual: compras_gov.raw_item_material
    chave_primaria: [codigoitem]
    classificacao: publico
    chaves: []

  unidade_fornecimento_material:
    descricao: Unidades de fornecimento associadas aos PDMs.
    granularidade: uma linha por PDM e unidade de fornecimento
    dominio: catalogo
    dag: catalogo_material_unidade_fornecimento_ingest_dag
    origem_atual: compras_gov.raw_unidade_fornecimento_material
    chave_primaria: []
    classificacao: publico
    chaves: []

  caracteristicas_material:
    descricao: Características dos itens e seus valores.
    granularidade: uma linha por item, característica e valor de característica
    dominio: catalogo
    dag: catalogo_material_caracteristicas_ingest_dag
    origem_atual: compras_gov.raw_caracteristicas_material
    chave_primaria: []
    classificacao: publico
    chaves: []

  secao_servico:
    descricao: >-
      Seções da hierarquia do catálogo de serviços.
    granularidade: uma linha por seção
    dominio: catalogo
    dag: catalogo_servico_hierarquia_ingest_dag
    origem_atual: compras_gov.raw_secao_servico
    chave_primaria: [codigosecao]
    classificacao: publico
    chaves: []

  divisao_servico:
    descricao: >-
      Divisões da hierarquia do catálogo de serviços.
    granularidade: uma linha por divisão
    dominio: catalogo
    dag: catalogo_servico_hierarquia_ingest_dag
    origem_atual: compras_gov.raw_divisao_servico
    chave_primaria: [codigodivisao]
    classificacao: publico
    chaves: [] 

  grupo_servico:
    descricao: >-
      Grupos da hierarquia do catálogo de serviços.
    granularidade: uma linha por grupo
    dominio: catalogo
    dag: catalogo_servico_hierarquia_ingest_dag
    origem_atual: compras_gov.raw_grupo_servico
    chave_primaria: [codigogrupo]
    classificacao: publico
    chaves: []
  
  classe_servico:
    descricao: >-
      Classes da hierarquia do catálogo de serviços.
    granularidade: uma linha por classe
    dominio: catalogo
    dag: catalogo_servico_hierarquia_ingest_dag
    origem_atual: compras_gov.raw_classe_servico
    chave_primaria: [codigoclasse]
    classificacao: publico
    chaves: []

  subclasse_servico:
    descricao: >-
      Subclasses da hierarquia do catálogo de serviços.
    granularidade: uma linha por subclasse
    dominio: catalogo
    dag: catalogo_servico_hierarquia_ingest_dag
    origem_atual: compras_gov.raw_subclasse_servico
    chave_primaria: [codigosubclasse]
    classificacao: publico
    chaves: []

  item_servico:
    descricao: >-
      Itens da hierarquia do catálogo de serviços, ativos e inativos. Em
      object storage, um item inativado mantém a linha ativa antiga: o status
      atual é o do registro mais recente por dt_ingest.
    granularidade: uma linha por item
    dominio: catalogo
    dag: catalogo_servico_item_ingest_dag
    origem_atual: compras_gov.raw_item_servico
    chave_primaria: [codigoservico]
    classificacao: publico
    chaves: []

  natureza_despesa_servico:
    descricao: >-
      Associação entre os serviços do catálogo e as naturezas de despesa sob
      as quais o serviço é empenhado. Não é um cadastro de naturezas de
      despesa: a mesma natureza aparece em vários serviços, e a origem repete
      pares sem deduplicar.
    granularidade: uma linha por associação entre serviço e natureza de despesa
    dominio: catalogo
    dag: catalogo_servico_natureza_despesa_ingest_dag
    origem_atual: compras_gov.raw_natureza_despesa_servico
    chave_primaria: [codigoservico, codigonaturezadespesa]
    classificacao: publico
    chaves: []

  und_medida_servico:
    descricao: Unidades de medida associadas aos serviços.
    granularidade: uma linha por serviço e unidade de medida
    dominio: catalogo
    dag: catalogo_servico_und_medida_ingest_dag
    origem_atual: compras_gov.raw_und_medida_servico
    chave_primaria: [codigoservico, siglaunidademedida]
    classificacao: publico
    chaves: []

  pgc_agregacao:
    descricao: >-
      Dados agregados do Plano de Contratações Anual por órgão e ano, incluindo
      quantidade total de itens e valor total estimado.
    granularidade: uma linha por órgão e ano do Plano de Contratações Anual
    dominio: pgc
    dag: pgc_agregacao_ingest_dag
    origem_atual: compras_gov.raw_pgc_agregacao
    chave_primaria: []
    classificacao: publico
    chaves: 
      - chave: nu_cnpj
        coluna: orgao
        verificado: true

  pgc_detalhe:
    descricao: >-
      Itens planejados no Plano de Contratações Anual, com informações do
      artefato, DFD, item de catálogo, quantidade e valor estimado.
    granularidade: uma linha por item planejado de um Plano de Contratações Anual
    dominio: pgc
    dag: pgc_detalhe_ingest_dag
    origem_atual: compras_gov.raw_pgc_detalhe
    chave_primaria: []
    classificacao: publico
    chaves: 
      - chave: nu_cnpj
        coluna: orgao
        verificado: true

  pgc_detalhe_catalogo:
    descricao: >-
      Itens planejados no Plano de Contratações Anual consultados a partir de
      códigos de material e serviço do catálogo Compras.gov.br.
    granularidade: uma linha por item planejado de um Plano de Contratações Anual, consultado por código de catálogo
    dominio: pgc
    dag: pgc_detalhe_catalogo_ingest_dag
    origem_atual: compras_gov.raw_pgc_detalhe_catalogo
    chave_primaria: []
    classificacao: publico
    chaves: 
      - chave: nu_cnpj
        coluna: orgao
        verificado: true

  pesquisa_preco_material:
    descricao: Registros de preços consultados para itens do catálogo de materiais
    granularidade: uma linha por registro de preço de material
    dominio: pesquisa_preco
    dag: pesquisa_preco_material_ingest_dag
    origem_atual: compras_gov.raw_pesquisa_preco_material
    chave_primaria: []
    classificacao: pessoal
    chaves: []

  pesquisa_preco_servico:
    descricao: Registros de preços consultados para itens do catálogo de serviços
    granularidade: uma linha por registro de preço de serviço
    dominio: pesquisa_preco
    dag: pesquisa_preco_servico_ingest_dag
    origem_atual: compras_gov.raw_pesquisa_preco_servico
    chave_primaria: []
    classificacao: pessoal
    chaves: []

  arp:
    descricao: >-
      Atas de Registro de Preço consultadas no módulo ARP do Compras.gov.br.
    granularidade: uma linha por ata de registro de preço e compra
    dominio: arp
    dag: arp_ingest_dag
    # Tabela Bronze materializada pelo modelo dbt arp a partir dos Parquets.
    origem_atual: 001_bnz_compras_gov.arp
    chave_primaria: [numeroAtaRegistroPreco, idCompra]
    classificacao: publico
    chaves: []

  arp_item:
    descricao: >-
      Itens associados às Atas de Registro de Preço do Compras.gov.br.
    granularidade: uma linha por item, fornecedor, ata, unidade gerenciadora e compra
    dominio: arp
    dag: arp_item_ingest_dag
    origem_atual: compras_gov.raw_arp_item
    chave_primaria:
      [
        numeroAtaRegistroPreco,
        codigoUnidadeGerenciadora,
        numeroItem,
        idCompra,
        niFornecedor,
      ]
    classificacao: publico
    chaves: []

  arp_unidades_item:
    descricao: >-
      Unidades vinculadas aos itens das Atas de Registro de Preço.
    granularidade: uma linha por unidade vinculada a um item de ata
    dominio: arp
    dag: arp_detalhes_ingest_dag
    origem_atual: compras_gov.raw_arp_unidades_item
    chave_primaria: []
    classificacao: publico
    chaves: []

  arp_adesoes_item:
    descricao: >-
      Adesões vinculadas aos itens das Atas de Registro de Preço.
    granularidade: uma linha por adesão vinculada a um item de ata
    dominio: arp
    dag: arp_detalhes_ingest_dag
    origem_atual: compras_gov.raw_arp_adesoes_item
    chave_primaria: []
    classificacao: publico
    chaves: []

  arp_empenhos_saldo:
    descricao: >-
      Empenhos e saldos vinculados às Atas de Registro de Preço.
    granularidade: uma linha por empenho e saldo de uma ata
    dominio: arp
    dag: arp_detalhes_ingest_dag
    origem_atual: compras_gov.raw_arp_empenhos_saldo
    chave_primaria: []
    classificacao: publico
    chaves: []
