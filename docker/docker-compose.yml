name: gov-bricks

# Base configuration for Airflow services
x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - ../.env
  volumes:
    - ../airflow/airflow.cfg:${AIRFLOW_HOME}/airflow.cfg
    - ../airflow/dags:${AIRFLOW_HOME}/dags/
    - ../airflow/plugins:${AIRFLOW_HOME}/plugins/
    - ../airflow/helpers:${AIRFLOW_HOME}/helpers/
    # Logs de task em volume nomeado, e não no filesystem do container: sem
    # isso todo `up --build` apaga o log de tudo que já rodou, e a UI de uma
    # execução antiga fica sem ter o que mostrar.
    - airflow-logs:${AIRFLOW_HOME}/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

# Common environment variables for Airflow
x-airflow-environment: &airflow-common-env
  AIRFLOW__CORE__DEFAULT_TIMEZONE: 'America/Sao_Paulo'
  AIRFLOW__CORE__ENABLE_XCOM_PICKLING: 'true'
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__TEST_CONNECTION: Enabled
  AIRFLOW__CORE__MIGHT_CONTAIN_DAG_CALLABLE: "dag_discovery.might_contain_selected_dag"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/airflow
  AIRFLOW__EMAIL__DEFAULT_EMAIL_ON_RETRY: 'false'
  AIRFLOW__EMAIL__DEFAULT_EMAIL_ON_FAILURE: 'false'
  AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: 'America/Sao_Paulo'
  AIRFLOW__WEBSERVER__INSTANCE_NAME: "GovHub - Local Dev!"
  AIRFLOW__WEBSERVER__NAVBAR_COLOR: '#98DFFF'
  AIRFLOW__WEBSERVER__RELOAD_ON_PLUGIN_CHANGE: 'true'
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:-govhub-airflow-local-dev}
  # Assina os tokens que o supervisor de task usa para falar com o api-server.
  # NÃO tem o mesmo default de [api] secret_key: quando não é informado, cada
  # PROCESSO sorteia o seu (os.urandom) e o Airflow tentaria persistir o sorteio
  # no airflow.cfg — que aqui vem montado do repositório, sem essa chave. No
  # `standalone` o scheduler e o api-server são processos separados, então cada
  # um fica com um segredo diferente e toda task despachada pelo scheduler morre
  # com "Invalid auth token: Signature verification failed", sem chegar a
  # escrever log. Por `airflow dags test` não aparecia: ali tudo roda num
  # processo só.
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-govhub-airflow-local-jwt}
  PYTHONPATH: "/opt/airflow/dags:/opt/airflow/plugins:/opt/airflow/helpers:$PYTHONPATH"
  _AIRFLOW_DB_MIGRATE: 'true'
  _AIRFLOW_WWW_USER_CREATE: 'true'
  _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
  _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${_AIRFLOW_WWW_USER_USERNAME:-airflow}:admin"
  AIRFLOW__CORE__PLUGINS_FOLDER: ${AIRFLOW_HOME}/plugins
  AIRFLOW__CORE__DAGS_FOLDER: ${AIRFLOW_HOME}/dags
  AIRFLOW_REPO_BASE: ${AIRFLOW_HOME}
  # A ENV AIRFLOW_REPO_BASE É IMPORTANTE PARA SINCRONIZAR COM O SISTEMA DE PASTAS
  # DO AIRFLOW EM HOMOLOG E PROD, ELES POSSUEM UMA ESTRUTURA DE PASTAS DIFERENTE
  # USAR ESSA ENV NOS CÓDIGOS PARA NÃO HAVER CONFLITOS

services:
  # Airflow Services
  airflow:
    <<: *airflow-common
    # Usamos o comando de standalone aqui para não rodar múltiplos containers
    # do airflow localmente e assim melhorar a velocidade inicialização
    # doc do standalone: https://airflow.apache.org/docs/apache-airflow/2.8.1/start.html
    # O `standalone` do Airflow 3 NÃO usa _AIRFLOW_WWW_USER_*: essas variáveis são
    # do entrypoint da imagem oficial, que só roda no fluxo de `airflow-init`.
    # Quem autentica aqui é o SimpleAuthManager, e ele SORTEIA a senha de todo
    # usuário que ainda não esteja no arquivo de senhas — arquivo que vive no
    # filesystem do container, e portanto some a cada recriação, com senha nova
    # a cada vez.
    #
    # Semear o arquivo antes de subir resolve os dois problemas: o manager só
    # sorteia para quem falta, então a credencial passa a ser a do .env e
    # sobrevive ao `up --build`.
    # O Airflow grava em cada task instance o hostname de quem a executou, e a
    # UI busca o log lá por HTTP (porta 8793) quando não o acha em disco. Com o
    # hostname aleatório do container, toda recriação deixava as execuções
    # anteriores apontando para um nome que não resolve mais. `airflow` é o
    # alias do serviço na rede do compose, então resolve sempre.
    hostname: airflow
    command:
      - bash
      - -c
      - |
        printf '{"%s": "%s"}\n' \
          "$${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          "$${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          > "$${AIRFLOW_HOME}/simple_auth_manager_passwords.json.generated"
        exec airflow standalone
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health" ]
      interval: 10s
      timeout: 60s
      start_period: 60s
      retries: 5
    restart: always
    environment:
      <<: *airflow-common-env

  # Postgres database
  postgres:
    image: postgres:15-alpine
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-db:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Landing zone (object storage) — ver ADR-0012
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Creates the landing zone bucket on first start
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET:-data-lake} &&
      echo 'Bucket ready.'
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-data-lake}

  # Ferramenta de consumo — onde as dashboards publicadas pelas DAGs de
  # data_publish/ são construídas, exportadas e servidas (ADR-0019).
  #
  # Fica no perfil `bi`: sobe com `make superset`, não com `make compose`. A
  # maior parte do trabalho no framework (ingestão, dbt, testes) não precisa
  # dele, e ele é o serviço mais pesado do compose.
  superset:
    # Imagem própria: a oficial não traz driver de Postgres (ver o Dockerfile).
    build:
      context: ./superset
      dockerfile: Dockerfile
    profiles: ["bi"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-govhub-superset-local-dev}
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    ports:
      - "${SUPERSET_HOST_PORT:-8088}:8088"
    volumes:
      # Metadados do Superset (papéis, filtros de recorte, dashboards
      # importadas) em volume nomeado, para sobreviverem a um restart. Em
      # homologação e produção o metastore é um banco de verdade, definido no
      # deployment, não aqui.
      - superset-home:/app/superset_home
    # `|| true` no create-admin: em subida repetida o usuário já existe, e o
    # comando falharia sem que houvesse nada errado.
    command: >
      bash -c "superset db upgrade && superset fab create-admin --username $${SUPERSET_ADMIN_USER} --firstname Admin --lastname GovHub --email admin@localhost --password $${SUPERSET_ADMIN_PASSWORD} || true; superset init && superset run -h 0.0.0.0 -p 8088 --with-threads"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 10
    restart: always

volumes:
  airflow-logs:
  postgres-db:
  minio-data:
  superset-home:
